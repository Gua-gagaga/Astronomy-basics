<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天球坐标知识测试</title>

  <style>
    /* =====================================================
       全屏样式
       修改点：保持 html、body 高度和溢出设置不变，
       页面铺满整个视口，内容过多时仅允许内部区域滚动
       ===================================================== */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --text-main: #e4edff;
      --text-sub: #b8c7e6;
      --panel-bg: rgba(5, 15, 40, .78);
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      color: #e4edff;
      background: #020617;
    }

    /* 修改点：恢复旧版星空背景，置于页面最底层 */
    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: -1;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.95) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(174,214,255,.75) 0 1px, transparent 1.5px),
        radial-gradient(circle, rgba(255,255,255,.65) 0 1px, transparent 1.5px);
      background-size: 97px 113px, 173px 149px, 251px 197px;
      background-position: 10px 20px, 80px 50px, 130px 10px;
      opacity: .55;
      animation: starMove 60s linear infinite;
    }

    body::after {
      opacity: .22;
      transform: scale(1.3);
      animation-duration: 100s;
      animation-direction: reverse;
    }

    /* 修改点：恢复旧版星星缓慢移动动画 */
    @keyframes starMove {
      from {
        transform: translate3d(0, 0, 0);
      }

      to {
        transform: translate3d(-70px, 40px, 0);
      }
    }

    #tq-module {
      position: relative;
      z-index: 1;
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .screen {
      position: relative;
      z-index: 1;
      width: min(900px, 100%);
      max-height: 100vh;
      height: 100vh;
      overflow-y: auto;
      padding: 30px;
      border: 1px solid rgba(190, 215, 255, .28);
      border-radius: 0;
      background: var(--panel-bg);
      box-shadow:
        0 18px 70px rgba(0, 0, 0, .45),
        inset 0 0 35px rgba(113, 161, 255, .08);
      backdrop-filter: blur(10px);
    }

    .hidden {
      display: none !important;
    }

    button {
      font-family: inherit;
    }

    /* =====================================================
       封面样式
       修改点：移除新版 celestial 天球，仅恢复旧版轨道天球
       ===================================================== */

    .intro {
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .intro-title {
      margin: 0;
      font-size: clamp(27px, 5vw, 45px);
      letter-spacing: 2px;
      text-shadow: 0 0 22px rgba(122, 192, 255, .7);
    }

    .intro-subtitle {
      margin: 13px 0 32px;
      color: var(--text-sub);
      font-size: 15px;
    }

    /* 修改点：恢复旧版轨道天球结构样式 */
    .intro-orbit {
      width: 170px;
      height: 170px;
      margin: 0 auto 25px;
      border: 1px solid rgba(132, 190, 255, .45);
      border-radius: 50%;
      position: relative;
      box-shadow:
        0 0 40px rgba(85, 160, 255, .25),
        inset 0 0 35px rgba(85, 160, 255, .14);
      animation: orbitRotate 12s linear infinite;
    }

    .intro-orbit::before,
    .intro-orbit::after {
      content: "";
      position: absolute;
      inset: 20px;
      border: 1px solid rgba(177, 125, 255, .42);
      border-radius: 50%;
      transform: rotate(62deg);
    }

    .intro-orbit::after {
      inset: 45px -15px;
      transform: rotate(-26deg);
    }

    /* 修改点：恢复旧版中心发光星球 */
    .planet {
      position: absolute;
      width: 34px;
      height: 34px;
      left: 68px;
      top: 68px;
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 30% 25%,
          #d7f3ff,
          #4c9bff 52%,
          #2440b2
        );
      box-shadow: 0 0 25px rgba(78, 164, 255, .95);
    }

    /* 修改点：恢复旧版轨道天球旋转动画 */
    @keyframes orbitRotate {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .cover-note {
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 16px;
      padding: 10px 16px;
      border-radius: 10px;
      color: #ccddff;
      background: rgba(0, 0, 0, .5);
      font-size: 15px;
      line-height: 1.5;
      text-align: center;
    }

    .mode-switcher {
      display: flex;
      justify-content: center;
      gap: 8px;
      margin: 0 auto 14px;
      flex-wrap: wrap;
    }

    .mode-button {
      padding: 8px 12px;
      border: 1px solid rgba(187, 213, 255, .35);
      border-radius: 999px;
      color: #cadcff;
      background: rgba(9, 26, 62, .68);
      cursor: pointer;
      font-size: 13px;
    }

    .mode-button.active {
      color: #fff;
      background: rgba(65, 109, 222, .85);
      border-color: #9ec2ff;
    }

    .cover-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .start-button {
      border: 1px solid rgba(190, 229, 255, .72);
      border-radius: 999px;
      padding: 16px 48px;
      color: #fff;
      background: linear-gradient(135deg, #4a8cff, #7d5cff);
      cursor: pointer;
      font-weight: 700;
      font-size: 19px;
      box-shadow:
        0 10px 30px rgba(39, 105, 255, .35),
        0 0 20px rgba(130, 115, 255, .25);
      transition: transform .2s, box-shadow .2s;
    }

    .start-button:hover {
      transform: translateY(-3px) scale(1.03);
      box-shadow:
        0 15px 38px rgba(39, 105, 255, .5),
        0 0 25px rgba(130, 115, 255, .4);
    }

    .wrong-retry-button {
      padding: 13px 22px;
      border: 1px solid rgba(173, 204, 255, .45);
      border-radius: 999px;
      color: #dce9ff;
      background: rgba(22, 50, 105, .78);
      cursor: pointer;
      font-size: 15px;
      font-weight: 700;
    }

    .wrong-retry-button:hover {
      background: rgba(49, 93, 172, .9);
    }

    .wrong-retry-button:disabled {
      opacity: .42;
      cursor: not-allowed;
    }

    /* =====================================================
       答题页面顶部
       ===================================================== */

    .test-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 15px;
    }

    .test-title {
      margin: 0;
      color: #e4edff;
      font-size: 22px;
    }

    .practice-label {
      display: inline-block;
      margin-left: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #cfe0ff;
      background: rgba(52, 92, 170, .65);
      font-size: 12px;
      font-weight: normal;
    }

    /* =====================================================
       倒计时
       修改点：保留最后5秒红色脉冲和缩放效果
       ===================================================== */

    #tq-timer {
      min-width: 78px;
      padding: 8px 12px;
      border-radius: 999px;
      color: #e74c3c;
      background: rgba(38, 25, 40, .8);
      font-size: 16px;
      font-weight: 700;
      text-align: center;
      transition: color .2s, opacity .2s, transform .2s;
    }

    #tq-timer.warning {
      color: #ff4444;
    }

    #tq-timer.warning.pulse {
      animation: timerPulse .5s ease-in-out;
    }

    @keyframes timerPulse {
      0% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .55;
        transform: scale(1.2);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* =====================================================
       进度条填充条
       修改点：彩色填充条放在标题下方、来源标注上方
       ===================================================== */

    .progress-wrap {
      margin: 0 0 22px;
    }

    .progress-line {
      height: 6px;
      margin-bottom: 0;
      overflow: hidden;
      border-radius: 20px;
      background: rgba(255, 255, 255, .12);
    }

    .progress-bar {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #65c8ff, #9c7cff);
      box-shadow: 0 0 12px rgba(89, 160, 255, .85);
      transition: width .3s ease;
    }

    .question-source {
      display: block;
      margin-bottom: 8px;
      color: #8899aa;
      font-size: .7em;
    }

    #tq-question {
      margin-bottom: 20px;
      color: #fff;
      font-size: 20px;
      line-height: 1.7;
    }

    #tq-options {
      display: grid;
      gap: 12px;
    }

    .option-button {
      width: 100%;
      padding: 15px 17px;
      border: 1px solid rgba(187, 213, 255, .32);
      border-radius: 12px;
      color: #edf4ff;
      background: rgba(18, 38, 83, .72);
      cursor: pointer;
      font-size: 16px;
      line-height: 1.5;
      text-align: left;
      transition: background .2s, border-color .2s, transform .2s;
    }

    .option-button:hover:not(:disabled) {
      border-color: #77aaff;
      background: rgba(47, 91, 175, .8);
      transform: translateX(4px);
    }

    .option-button:disabled {
      cursor: default;
    }

    .option-button.correct {
      border-color: #45d483;
      background: rgba(28, 127, 73, .75);
    }

    .option-button.wrong {
      border-color: #ff6262;
      background: rgba(150, 39, 45, .75);
    }

    #tq-feedback {
      min-height: 60px;
      margin-top: 20px;
      padding: 13px 15px;
      border-radius: 10px;
      color: #dfeaff;
      background: rgba(0, 0, 0, .28);
      line-height: 1.7;
    }

    .action-row {
      display: flex;
      justify-content: center;
      margin-top: 22px;
    }

    .next-button,
    .restart-button {
      display: block;
      margin: 0 auto;
      padding: 13px 28px;
      border: 0;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, #3579ff, #7d55ff);
      box-shadow: 0 8px 25px rgba(66, 108, 255, .4);
      cursor: pointer;
      font-size: 16px;
      font-weight: 700;
      transition: transform .2s, box-shadow .2s;
    }

    .next-button:hover,
    .restart-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(66, 108, 255, .6);
    }

    .next-button:disabled {
      opacity: .45;
      cursor: not-allowed;
      transform: none;
    }

    /* =====================================================
       答题进度文字
       修改点：进度文字移动到下一题按钮下方、页面底部
       ===================================================== */

    .progress-text-bottom {
      margin-top: 22px;
      padding-top: 14px;
      border-top: 1px solid rgba(173, 204, 255, .14);
      color: #aebdd9;
      font-size: 14px;
      text-align: center;
    }

    /* =====================================================
       结果页和复盘样式
       ===================================================== */

    #tq-review {
      margin-top: 22px;
    }

    .review-card {
      margin-top: 14px;
      padding: 16px;
      border: 1px solid rgba(175, 202, 255, .25);
      border-radius: 12px;
      background: rgba(13, 30, 68, .72);
    }

    .review-card-title {
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.6;
    }

    .review-answer {
      margin-top: 8px;
      color: #cad8ee;
      font-size: 14px;
      line-height: 1.7;
    }

    /* =====================================================
       跳转链接生成
       ===================================================== */

    .knowledge-link {
      display: inline-block;
      margin-top: 10px;
      color: #9cc4ff;
      font-size: 14px;
      text-decoration: none;
    }

    .knowledge-link:hover {
      color: #fff;
      text-decoration: underline;
    }

    .similar-button {
      margin-top: 10px;
      margin-left: 10px;
      padding: 8px 12px;
      border: 1px solid rgba(173, 204, 255, .45);
      border-radius: 999px;
      color: #dce9ff;
      background: rgba(22, 50, 105, .78);
      cursor: pointer;
      font-size: 13px;
    }

    .similar-button:hover {
      background: rgba(49, 93, 172, .9);
    }

    .result-score {
      margin: 15px 0;
      color: #dce9ff;
      font-size: 24px;
      font-weight: 700;
      text-align: center;
    }

    .result-summary {
      color: #b6c7e4;
      line-height: 1.8;
      text-align: center;
    }

    /* =====================================================
       移动端适配
       ===================================================== */

    @media (max-width: 700px) {
      #tq-module {
        padding: 0;
      }

      .screen {
        width: 100vw;
        max-height: 100vh;
        padding: 20px 15px;
      }

      .intro-orbit {
        width: 140px;
        height: 140px;
      }

      .planet {
        width: 28px;
        height: 28px;
        left: 56px;
        top: 56px;
      }

      #tq-question {
        font-size: 18px;
      }

      .option-button {
        padding: 13px;
        font-size: 15px;
      }
    }
  </style>
</head>

<body>
  <div id="tq-module">

    <!-- =====================================================
         封面
         修改点：删除所有 celestial 相关元素，
         仅保留旧版轨道天球
         ===================================================== -->

    <section id="tq-intro" class="screen intro">
      <div class="intro-orbit" aria-hidden="true">
        <div class="planet"></div>
      </div>

      <h1 class="intro-title">天球坐标知识测试</h1>
      <p class="intro-subtitle">从地理坐标到天球坐标</p>

      <div class="mode-switcher">
        <button class="mode-button" data-mode="low">
          低年组专项
        </button>

        <button class="mode-button" data-mode="high">
          高年组专项
        </button>

        <button class="mode-button active" data-mode="mixed">
          混合模拟
        </button>
      </div>

      <div class="cover-note">
        📌 注：题库共包含30道真题与改编题，每次随机抽取5道进行测试。
      </div>

      <!-- 修改点：错题重练按钮继续位于开始测试按钮正下方 -->
      <div class="cover-actions">
        <button id="tq-start" class="start-button">
          开始测试
        </button>

        <button id="tq-wrong-retry" class="wrong-retry-button">
          📂 错题重练
        </button>
      </div>
    </section>

    <!-- =====================================================
         答题页面
         ===================================================== -->

    <section id="tq-test" class="screen hidden">
      <div class="test-top">
        <h2 class="test-title">
          天文知识测试
          <span id="tq-practice-label" class="practice-label hidden">
            补充练习
          </span>
        </h2>

        <div id="tq-timer">00:30</div>
      </div>

      <!-- 修改点：只保留彩色进度条，放到标题下方 -->
      <div class="progress-wrap">
        <div class="progress-line">
          <div id="tq-progress-fill" class="progress-bar"></div>
        </div>
      </div>

      <div id="tq-question"></div>

      <div id="tq-options"></div>

      <div id="tq-feedback">
        请选择一个答案。
      </div>

      <div class="action-row">
        <button id="tq-next" class="next-button" disabled>
          下一题
        </button>
      </div>

      <!-- 修改点：答题进度文字移动到下一题按钮下方 -->
      <div class="progress-text-bottom">
        第 <span id="tq-progress-text">1</span> /
        <span id="tq-total-text">5</span> 题
        &nbsp;·&nbsp;
        得分：<span id="tq-score-text">0</span>
      </div>
    </section>

    <!-- =====================================================
         结果页面
         ===================================================== -->

    <section id="tq-result" class="screen hidden">
      <h2 class="test-title" style="text-align:center;">
        测试完成
      </h2>

      <div id="tq-final-score" class="result-score"></div>
      <div id="tq-result-summary" class="result-summary"></div>

      <div id="tq-review"></div>

      <button id="tq-retry-all" class="restart-button">
        重新开始测试
      </button>
    </section>
  </div>

  <script>
    "use strict";

    document.addEventListener("DOMContentLoaded", function () {
      const TIME_LIMIT = 30;
      const WRONG_STORAGE_KEY = "wrongQuestions";

      /* =====================================================
         总题库区域
         ===================================================== */

      const questionsBank = [
        {
          id: "q1",
          difficulty: "low",
          type: "original",
          knowledgePoint: "地平坐标系的坐标定义",
          source: "CNAO 2022 决赛相关知识点改编",
          question: "地平坐标系中，描述天体位置所使用的两个基本坐标通常是：",
          options: ["方位角和高度角", "赤经和赤纬", "黄经和黄纬", "银经和银纬"],
          answer: "方位角和高度角",
          explanation: "地平坐标系以观测者所在地的地平圈和天顶为参考，使用方位角描述水平方向，使用高度角描述天体相对于地平线的高度。赤经赤纬属于赤道坐标系，黄经黄纬属于黄道坐标系，银经银纬属于银道坐标系。"
        },
        {
          id: "q2",
          difficulty: "low",
          type: "adapted",
          knowledgePoint: "地平坐标系的坐标定义",
          source: "根据CNAO地平坐标相关题改编",
          question: "在地平坐标系中，高度角为90°的方向是：",
          options: ["天顶", "天底", "天北极", "春分点"],
          answer: "天顶",
          explanation: "高度角从地平线向上测量，地平线高度角为0°，天顶高度角为90°。"
        },
        {
          id: "q3",
          difficulty: "low",
          type: "original",
          knowledgePoint: "地平坐标系的特点",
          source: "CNAO 2023 预赛相关知识点改编",
          question: "地平坐标系最大的特点是：",
          options: ["与观测者的地点和时间有关", "与观测地点完全无关", "只适合描述银河系结构", "坐标永远不会随时间变化"],
          answer: "与观测者的地点和时间有关",
          explanation: "地平坐标系以观测者当地地平面为参考，因此观测地点改变或时间改变时，天体的方位角和高度角都可能发生变化。"
        },
        {
          id: "q4",
          difficulty: "low",
          type: "adapted",
          knowledgePoint: "地平坐标系的特点",
          source: "根据CNAO地平坐标相关题改编",
          question: "同一天体在两个不同城市同时观测时，最可能不同的是：",
          options: ["地平坐标", "天体真实质量", "天体光谱类型", "天体物理性质"],
          answer: "地平坐标",
          explanation: "不同城市的地理位置不同，当地地平面和天顶方向也不同，所以同一天体的地平坐标可能不同，但天体自身的物理性质不会因此改变。"
        },
        {
          id: "q5",
          difficulty: "low",
          type: "original",
          knowledgePoint: "时角坐标系",
          source: "CNAO 2022 决赛相关知识点改编",
          question: "时角坐标系中，时角通常是从哪个方向开始测量的？",
          options: ["当地子午圈", "黄道面", "银河平面", "天底方向"],
          answer: "当地子午圈",
          explanation: "时角表示天体相对于当地子午圈的角距离，是当地天球定位的重要坐标量。"
        },
        {
          id: "q6",
          difficulty: "low",
          type: "adapted",
          knowledgePoint: "时角坐标系",
          source: "根据CNAO时角坐标相关题改编",
          question: "当某天体的时角为0时，通常表示该天体：",
          options: ["位于当地子午圈上", "位于天底", "位于银道面上", "位于黄道北极"],
          answer: "位于当地子午圈上",
          explanation: "时角为0说明天体与当地子午圈重合，天体此时位于当地子午圈上。"
        },
        {
          id: "q7",
          difficulty: "low",
          type: "original",
          knowledgePoint: "地方恒星时",
          source: "CNAO 2023 预赛相关知识点改编",
          question: "地方恒星时在观测中的主要用途是：",
          options: ["判断某一赤经天体是否接近中天", "计算天体表面温度", "确定月球质量", "测量太阳直径"],
          answer: "判断某一赤经天体是否接近中天",
          explanation: "地方恒星时与天体赤经结合，可以计算天体时角，从而判断天体是否接近当地子午圈。"
        },
        {
          id: "q8",
          difficulty: "low",
          type: "adapted",
          knowledgePoint: "地方恒星时",

      /* =====================================================
         通用工具函数
         ===================================================== */

      function shuffle(array) {
        const result = array.slice();

        for (let i = result.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));

          [result[i], result[j]] =
            [result[j], result[i]];
        }

        return result;
      }

      function takeRandom(array, count) {
        return shuffle(array).slice(0, count);
      }

      function getOptionLetter(index) {
        return String.fromCharCode(65 + index);
      }

      function getCorrectIndex(question) {
        return question.options.indexOf(question.answer);
      }

      function formatTime(seconds) {
        return "00:" + String(seconds).padStart(2, "0");
      }

      function clearTimer() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      /* =====================================================
         错题本地存储
         修改点：错题数量是多少就练习多少道，不再补足到5道
         ===================================================== */

      function getWrongIds() {
        try {
          const value = JSON.parse(
            localStorage.getItem(WRONG_STORAGE_KEY) || "[]"
          );

          return Array.isArray(value) ? value : [];
        } catch (error) {
          return [];
        }
      }

      function saveWrongIds(ids) {
        localStorage.setItem(
          WRONG_STORAGE_KEY,
          JSON.stringify(Array.from(new Set(ids)))
        );

        updateWrongButton();
      }

      function addWrongId(id) {
        const ids = getWrongIds();

        if (!ids.includes(id)) {
          ids.push(id);
          saveWrongIds(ids);
        }
      }

      function removeWrongId(id) {
        saveWrongIds(
          getWrongIds().filter(function (item) {
            return item !== id;
          })
        );
      }

      function updateWrongButton() {
        const count = getWrongIds().length;

        wrongRetryButton.disabled = count === 0;
        wrongRetryButton.title =
          count === 0
            ? "暂无错题"
            : "当前错题数量：" + count;

        wrongRetryButton.textContent =
          count === 0
            ? "📂 错题重练（暂无错题）"
            : "📂 错题重练（" + count + "道）";
      }

      /* =====================================================
         随机抽题函数
         ===================================================== */

      function getSpecialQuestions(difficulty) {
        const pool = questionsBank.filter(function (question) {
          return question.difficulty === difficulty;
        });

        if (pool.length < 5) {
          throw new Error("当前专项题库不足5道，请扩充题库后重试。");
        }

        return takeRandom(pool, 5);
      }

      function getMixedQuestions() {
        const lowOriginal = questionsBank.filter(function (question) {
          return question.difficulty === "low" &&
            question.type === "original";
        });

        const highOriginal = questionsBank.filter(function (question) {
          return question.difficulty === "high" &&
            question.type === "original";
        });

        const lowAdapted = questionsBank.filter(function (question) {
          return question.difficulty === "low" &&
            question.type === "adapted";
        });

        const highAdapted = questionsBank.filter(function (question) {
          return question.difficulty === "high" &&
            question.type === "adapted";
        });

        const result = shuffle(
          takeRandom(lowOriginal, 1)
            .concat(takeRandom(highOriginal, 2))
            .concat(takeRandom(lowAdapted, 1))
            .concat(takeRandom(highAdapted, 1))
        );

        return result;
      }

      /* =====================================================
         进度条更新函数
         ===================================================== */

      function updateProgress() {
        const total = selectedQuestions.length;
        const current = currentIndex + 1;

        progressTextEl.textContent = String(current);
        totalTextEl.textContent = String(total);
        scoreTextEl.textContent = String(score);

        progressFillEl.style.width =
          Math.min(100, current / total * 100) + "%";
      }

      /* =====================================================
         倒计时函数
         ===================================================== */

      function startTimer() {
        clearTimer();

        timeLeft = TIME_LIMIT;
        timerEl.textContent = formatTime(timeLeft);
        timerEl.classList.remove("warning", "pulse");

        timer = setInterval(function () {
          timeLeft--;
          timerEl.textContent = formatTime(timeLeft);

          if (timeLeft <= 5) {
            timerEl.classList.add("warning");

            timerEl.classList.remove("pulse");
            void timerEl.offsetWidth;
            timerEl.classList.add("pulse");
          }

          if (timeLeft <= 0) {
            submitAnswer(null, true);
          }
        }, 1000);
      }

      /* =====================================================
         会话控制
         ===================================================== */

      function startSession(questions, mode) {
        selectedQuestions = questions.map(function (question) {
          return {
            ...question,
            options: shuffle(question.options)
          };
        });

        sessionMode = mode;
        currentIndex = 0;
        score = 0;
        records = [];

        introEl.classList.add("hidden");
        resultEl.classList.add("hidden");
        testEl.classList.remove("hidden");

        if (sessionMode === "practice") {
          practiceLabelEl.classList.remove("hidden");
        } else {
          practiceLabelEl.classList.add("hidden");
        }

        renderQuestion();
      }

      function startNormalTest() {
        try {
          let questions;

          if (currentMode === "low") {
            questions = getSpecialQuestions("low");
          } else if (currentMode === "high") {
            questions = getSpecialQuestions("high");
          } else {
            questions = getMixedQuestions();
          }

          startSession(questions, "normal");
        } catch (error) {
          alert(error.message);
        }
      }

      /* 修改点：错题有多少道就练多少道，不从总题库补题 */
      function startWrongPractice() {
        const wrongIds = getWrongIds();

        if (wrongIds.length === 0) {
          alert("暂无错题");
          updateWrongButton();
          return;
        }

        const wrongQuestions = questionsBank.filter(function (question) {
          return wrongIds.includes(question.id);
        });

        if (wrongQuestions.length === 0) {
          alert("暂无错题");
          updateWrongButton();
          return;
        }

        /* 修改点：直接练习全部错题，不再限制为5道或补足5道 */
        startSession(shuffle(wrongQuestions), "wrong");
      }

      /* =====================================================
         题目显示
         ===================================================== */

      function renderQuestion() {
        const question = selectedQuestions[currentIndex];

        answered = false;
        nextButton.disabled = true;

        question.options = shuffle(question.options);

        questionEl.innerHTML =
          '<span class="question-source">[来源：' +
          question.source +
          "]</span>" +
          "<div>" +
          question.question +
          "</div>";

        optionsEl.innerHTML = "";

        question.options.forEach(function (option, index) {
          const button = document.createElement("button");

          button.type = "button";
          button.className = "option-button";
          button.textContent =
            getOptionLetter(index) + ". " + option;

          button.addEventListener("click", function () {
            submitAnswer(index, false);
          });

          optionsEl.appendChild(button);
        });

        feedbackEl.textContent = "请选择一个答案。";
        feedbackEl.style.color = "#dfeaff";
        feedbackEl.style.background = "rgba(0, 0, 0, .28)";

        updateProgress();
        startTimer();
      }

      function disableOptions() {
        optionsEl.querySelectorAll("button").forEach(function (button) {
          button.disabled = true;
        });
      }

      function showAnswerStyles(selectedIndex, correctIndex) {
        optionsEl.querySelectorAll("button").forEach(function (button, index) {
          if (index === correctIndex) {
            button.classList.add("correct");
          }

          if (
            selectedIndex !== null &&
            index === selectedIndex &&
            index !== correctIndex
          ) {
            button.classList.add("wrong");
          }
        });
      }

      /* =====================================================
         答题判定
         ===================================================== */

      function submitAnswer(selectedIndex, isTimeout) {
        if (answered) {
          return;
        }

        answered = true;
        clearTimer();
        disableOptions();

        const question = selectedQuestions[currentIndex];
        const correctIndex = getCorrectIndex(question);
        const isCorrect = selectedIndex === correctIndex;

        showAnswerStyles(selectedIndex, correctIndex);

        records[currentIndex] = {
          question: question,
          selectedIndex: selectedIndex,
          correctIndex: correctIndex,
          isCorrect: isCorrect,
          isTimeout: isTimeout
        };

        if (isCorrect) {
          score++;

          if (sessionMode === "wrong") {
            removeWrongId(question.id);
          }

          feedbackEl.style.color = "#9dffbf";
          feedbackEl.style.background = "rgba(24, 112, 62, .35)";
          feedbackEl.innerHTML =
            "回答正确。<br>" +
            "知识点：" +
            question.knowledgePoint +
            "<br>解析：" +
            question.explanation;
        } else {
          addWrongId(question.id);

          feedbackEl.style.color = "#ffb3b3";
          feedbackEl.style.background = "rgba(136, 30, 40, .35)";
          feedbackEl.innerHTML =
            (isTimeout ? "时间到。 " : "回答错误。 ") +
            "正确答案是 " +
            getOptionLetter(correctIndex) +
            "。<br>" +
            "知识点：" +
            question.knowledgePoint +
            "<br>解析：" +
            question.explanation;
        }

        updateProgress();
        nextButton.disabled = false;
      }

      /* =====================================================
         跳转链接生成
         ===================================================== */

      function createKnowledgeLink() {
        const link = document.createElement("a");

        link.href =
          "https://sdaa.novas.top/celestial-coordinates.mdx";
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.className = "knowledge-link";
        link.textContent = "📖 查看知识点详解";

        return link;
      }

      /* =====================================================
         同类改编题
         ===================================================== */

      function createSimilarButton(question) {
        const button = document.createElement("button");

        button.type = "button";
        button.className = "similar-button";
        button.textContent = "🔁 练同类改编题";

        button.addEventListener("click", function () {
          const candidates = questionsBank.filter(function (candidate) {
            return candidate.id !== question.id &&
              candidate.type === "adapted" &&
              candidate.knowledgePoint === question.knowledgePoint;
          });

          if (candidates.length === 0) {
            alert("该知识点暂无同类改编题，建议复习笔记。");
            return;
          }

          startSession([takeRandom(candidates, 1)[0]], "practice");
        });

        return button;
      }

      /* =====================================================
         复盘页面
         ===================================================== */

      function renderReview() {
        reviewEl.innerHTML = "";

        const focusTitle = document.createElement("h3");
        focusTitle.textContent = "建议重点复习的知识点";
        focusTitle.style.color = "#dbe8ff";
        reviewEl.appendChild(focusTitle);

        const wrongRecords = records.filter(function (record) {
          return record && !record.isCorrect;
        });

        const focusText = document.createElement("p");
        focusText.style.color = "#b6c7e4";
        focusText.style.lineHeight = "1.8";

        if (wrongRecords.length === 0) {
          focusText.textContent = "本次没有错题，继续保持！";
        } else {
          focusText.textContent = Array.from(
            new Set(
              wrongRecords.map(function (record) {
                return record.question.knowledgePoint;
              })
            )
          ).join("、");
        }

        reviewEl.appendChild(focusText);

        const reviewTitle = document.createElement("h3");
        reviewTitle.textContent = "答题复盘";
        reviewTitle.style.color = "#dbe8ff";
        reviewTitle.style.marginTop = "22px";
        reviewEl.appendChild(reviewTitle);

        if (wrongRecords.length === 0) {
          const perfect = document.createElement("p");
          perfect.textContent = "恭喜你，本次测试全部答对！";
          perfect.style.color = "#9dffbf";
          reviewEl.appendChild(perfect);
          return;
        }

        wrongRecords.forEach(function (record, index) {
          const question = record.question;
          const card = document.createElement("div");

          card.className = "review-card";

          const title = document.createElement("div");
          title.className = "review-card-title";
          title.innerHTML =
            '<span class="question-source">[来源：' +
            question.source +
            "]</span>" +
            "错题 " +
            (index + 1) +
            "：" +
            question.question;

          const answer = document.createElement("div");
          answer.className = "review-answer";
          answer.innerHTML =
            "正确答案：" +
            getOptionLetter(record.correctIndex) +
            "．" +
            question.answer +
            "<br>" +
            "知识点：" +
            question.knowledgePoint +
            "<br>" +
            "题型：" +
            (question.type === "original" ? "真题" : "改编题") +
            "<br>" +
            "难度：" +
            (question.difficulty === "low" ? "低年组" : "高年组");

          const explanation = document.createElement("div");
          explanation.className = "review-answer";
          explanation.innerHTML =
            "<strong>解析：</strong>" +
            question.explanation;

          card.appendChild(title);
          card.appendChild(answer);
          card.appendChild(explanation);
          card.appendChild(createKnowledgeLink());
          card.appendChild(createSimilarButton(question));

          reviewEl.appendChild(card);
        });
      }

      /* =====================================================
         页面跳转
         ===================================================== */

      function showResult() {
        clearTimer();

        if (sessionMode === "practice") {
          testEl.classList.add("hidden");
          introEl.classList.remove("hidden");
          practiceLabelEl.classList.add("hidden");

          alert("补充练习完成，本题不计入总分。");
          updateWrongButton();
          return;
        }

        testEl.classList.add("hidden");
        resultEl.classList.remove("hidden");

        finalScoreEl.textContent =
          "答对 " +
          score +
          " / " +
          selectedQuestions.length +
          " 题";

        let modeName = "混合模拟";

        if (currentMode === "low") {
          modeName = "低年组专项";
        } else if (currentMode === "high") {
          modeName = "高年组专项";
        }

        resultSummaryEl.textContent =
          "本次模式：" +
          modeName +
          "。错题已保存，可在封面进入错题重练。";

        renderReview();
      }

      /* =====================================================
         事件绑定
         ===================================================== */

      modeButtons.forEach(function (button) {
        button.addEventListener("click", function () {
          modeButtons.forEach(function (item) {
            item.classList.remove("active");
          });

          button.classList.add("active");
          currentMode = button.dataset.mode;
        });
      });

      startButton.addEventListener("click", function () {
        startNormalTest();
      });

      wrongRetryButton.addEventListener("click", function () {
        startWrongPractice();
      });

      nextButton.addEventListener("click", function () {
        if (!answered) {
          return;
        }

        currentIndex++;

        if (currentIndex >= selectedQuestions.length) {
          showResult();
        } else {
          renderQuestion();
        }
      });

      retryButton.addEventListener("click", function () {
        clearTimer();

        resultEl.classList.add("hidden");
        testEl.classList.add("hidden");
        introEl.classList.remove("hidden");
        practiceLabelEl.classList.add("hidden");

        updateWrongButton();
      });

      updateWrongButton();
    });
  </script>
</body>
</html>
