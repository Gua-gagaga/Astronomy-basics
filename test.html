<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>天球坐标系真题演练</title>
</head>

<body style="margin:20px; background:#f5f7fb;">

  <div id="tq-module" style="font-family:Arial,'Microsoft YaHei',sans-serif; max-width:860px; margin:auto; border:1px solid #ddd; border-radius:8px; padding:16px; background:#fff; box-shadow:0 2px 6px rgba(0,0,0,.05);">

    <!-- 开始页面 -->
    <div id="tq-intro">
      <div style="font-weight:700; font-size:18px; color:#333; margin-bottom:8px;">
        真题演练 — 天球坐标系综合练习
      </div>

      <div style="color:#555; line-height:1.7; margin-bottom:14px;">
        本练习共 5 题，每题限时 30 秒。选择答案后会立即显示正确答案和解析。
        测试结束后将根据答错或超时的题目，汇总你需要重点复习的知识点。
      </div>

      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:14px; padding:7px 11px; border-radius:20px; color:#fff; background:#4a8cff;">
          每题 30 秒，超时视为未作答
        </div>

        <button id="tq-start"
          style="padding:12px 18px; border:0; border-radius:8px; background:#4a8cff; color:#fff; cursor:pointer; font-weight:700; font-size:14px;">
          开始测试
        </button>
      </div>
    </div>

    <!-- 答题页面 -->
    <div id="tq-test" style="display:none;">

      <div style="display:flex; align-items:center; justify-content:space-between; gap:12px; margin:6px 0 14px;">
        <div style="font-weight:700; font-size:17px; color:#333;">
          天球坐标系单选题
        </div>

        <div id="tq-timer"
          style="font-weight:700; font-size:14px; color:#fff; background:#ff6b6b; padding:7px 11px; border-radius:20px;">
          00:30
        </div>
      </div>

      <div id="tq-question" style="font-size:16px; color:#333; line-height:1.6; margin-bottom:14px;"></div>

      <div id="tq-options" style="display:flex; flex-direction:column; gap:9px;"></div>

      <div id="tq-feedback"
        style="margin-top:14px; min-height:50px; padding:10px; border-radius:6px; background:#fafafa; color:#333; line-height:1.7; font-size:14px;">
        请选择一个答案。
      </div>

      <div style="margin-top:14px; display:flex; gap:10px; flex-wrap:wrap;">
        <button id="tq-retry"
          style="padding:9px 13px; border:1px solid #ccc; background:#f7f7f7; border-radius:6px; cursor:pointer;">
          重试本题
        </button>

        <button id="tq-next"
          disabled
          style="padding:9px 13px; border:1px solid #ccc; background:#f7f7f7; border-radius:6px; cursor:not-allowed; opacity:.55;">
          下一题
        </button>
      </div>

      <hr style="margin:18px 0; border:none; border-top:1px solid #eee;" />

      <div style="font-size:14px; color:#555;">
        题目进度：<span id="tq-progress-text">1/5</span>
        &nbsp;•&nbsp;
        得分：<span id="tq-score-text">0</span> / 5
      </div>
    </div>

    <!-- 结果页面 -->
    <div id="tq-result" style="display:none;">
      <div style="font-weight:700; font-size:18px; color:#333; margin-bottom:8px;">
        测试完成
      </div>

      <div id="tq-result-text" style="color:#333; line-height:1.7;">
        你的得分是：<strong id="tq-final-score">0</strong> / 5
      </div>

      <!-- 学习报告由 JavaScript 写入 -->
      <div id="tq-review"
        style="margin-top:16px; padding:14px; border:1px solid #dbe8ff; border-radius:8px; background:#f7fbff; color:#333; line-height:1.7; font-size:14px;">
      </div>

      <div style="margin-top:14px;">
        <button id="tq-retry-all"
          style="padding:9px 13px; border:1px solid #ccc; background:#f7f7f7; border-radius:6px; cursor:pointer;">
          重新开始测试
        </button>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      "use strict";

      const TIME_LIMIT = 30;

      const questionsBank = [
        {
          text: "天球坐标系中，天体的位置通常用哪两组坐标表示？",
          options: [
            "赤经（RA）与赤纬（Dec）",
            "经度与纬度",
            "方位角与高度",
            "黄经与黄纬"
          ],
          answerIndex: 0,
          knowledgePoint: "赤道坐标系的基本概念",
          explanation:
            "赤道坐标系通常使用赤经（RA）和赤纬（Dec）描述天体位置。赤经类似地理经度，赤纬类似地理纬度。"
        },
        {
          text: "赤经（RA）为 12h 时，大致相当于多少角度？",
          options: [
            "90°",
            "180°",
            "270°",
            "360°"
          ],
          answerIndex: 1,
          knowledgePoint: "赤经的单位换算",
          explanation:
            "全天一周为 360°，同时赤经的一周为 24h，因此 1h = 15°。所以 12h × 15° = 180°。"
        },
        {
          text: "在赤道坐标系中，赤经（RA）通常使用什么单位表示？",
          options: [
            "度、分、秒",
            "弧度",
            "时、分、秒",
            "米、千米"
          ],
          answerIndex: 2,
          knowledgePoint: "赤经的单位",
          explanation:
            "赤经一般使用时、分、秒表示，范围是 0h 至 24h。赤纬则通常以度、分、秒表示。"
        },
        {
          text: "赤纬（Dec）为正值时，表示天体位于天赤道的哪一侧？",
          options: [
            "天赤道以北",
            "天赤道以南",
            "天赤道上",
            "无法判断"
          ],
          answerIndex: 0,
          knowledgePoint: "赤纬的正负含义",
          explanation:
            "赤纬为正表示天体位于天赤道以北；赤纬为负表示位于天赤道以南；赤纬等于 0° 时，天体位于天赤道上。"
        },
        {
          text: "若一个天体的赤纬为 +90°，它位于天球的哪个位置？",
          options: [
            "天北极",
            "天南极",
            "春分点",
            "天赤道"
          ],
          answerIndex: 0,
          knowledgePoint: "天极与赤纬范围",
          explanation:
            "赤纬的范围为 -90° 到 +90°。+90° 对应天北极，-90° 对应天南极。"
        }
      ];

      let questions = [];
      let currentIndex = 0;
      let score = 0;
      let timer = null;
      let timeLeft = TIME_LIMIT;
      let answered = false;

      /*
       * 每题作答记录：
       * correct: 是否正确
       * timeout: 是否超时
       * selectedIndex: 所选答案；超时时为 null
       */
      let records = [];

      const introEl = document.getElementById("tq-intro");
      const testEl = document.getElementById("tq-test");
      const resultEl = document.getElementById("tq-result");

      const startBtn = document.getElementById("tq-start");
      const retryBtn = document.getElementById("tq-retry");
      const nextBtn = document.getElementById("tq-next");
      const retryAllBtn = document.getElementById("tq-retry-all");

      const timerEl = document.getElementById("tq-timer");
      const questionEl = document.getElementById("tq-question");
      const optionsEl = document.getElementById("tq-options");
      const feedbackEl = document.getElementById("tq-feedback");

      const progressTextEl = document.getElementById("tq-progress-text");
      const scoreTextEl = document.getElementById("tq-score-text");
      const finalScoreEl = document.getElementById("tq-final-score");
      const reviewEl = document.getElementById("tq-review");

      function shuffle(array) {
        const copied = array.slice();

        for (let i = copied.length - 1; i > 0; i--) {
          const randomIndex = Math.floor(Math.random() * (i + 1));
          [copied[i], copied[randomIndex]] = [copied[randomIndex], copied[i]];
        }

        return copied;
      }

      function optionLetter(index) {
        return String.fromCharCode(65 + index);
      }

      function formatTime(seconds) {
        const minutes = Math.floor(seconds / 60);
        const secs = seconds % 60;

        return String(minutes).padStart(2, "0") + ":" +
               String(secs).padStart(2, "0");
      }

      function updateScoreAndProgress() {
        progressTextEl.textContent = (currentIndex + 1) + "/" + questions.length;
        scoreTextEl.textContent = String(score);
      }

      function setNextButton(enabled) {
        nextBtn.disabled = !enabled;
        nextBtn.style.opacity = enabled ? "1" : ".55";
        nextBtn.style.cursor = enabled ? "pointer" : "not-allowed";
      }

      function clearTimer() {
        if (timer !== null) {
          clearInterval(timer);
          timer = null;
        }
      }

      function startTimer() {
        clearTimer();

        timeLeft = TIME_LIMIT;
        timerEl.textContent = formatTime(timeLeft);
        timerEl.style.background = "#ff6b6b";

        timer = setInterval(function () {
          timeLeft--;
          timerEl.textContent = formatTime(timeLeft);

          if (timeLeft <= 5) {
            timerEl.style.background = "#d64545";
          }

          if (timeLeft <= 0) {
            submitAnswer(null, true);
          }
        }, 1000);
      }

      function disableAllOptions() {
        const buttons = optionsEl.querySelectorAll("button");

        buttons.forEach(function (button) {
          button.disabled = true;
          button.style.cursor = "default";
        });
      }

      function markAnswers(selectedIndex) {
        const currentQuestion = questions[currentIndex];
        const buttons = optionsEl.querySelectorAll("button");

        buttons.forEach(function (button, index) {
          button.style.background = "#fff";
          button.style.borderColor = "#ddd";
          button.style.color = "#333";

          if (index === currentQuestion.answerIndex) {
            button.style.background = "#e6f9e6";
            button.style.borderColor = "#42a65a";
          }

          if (
            selectedIndex !== null &&
            selectedIndex !== currentQuestion.answerIndex &&
            index === selectedIndex
          ) {
            button.style.background = "#fff0f0";
            button.style.borderColor = "#df5252";
          }
        });
      }

      function renderQuestion() {
        const currentQuestion = questions[currentIndex];

        answered = false;
        clearTimer();
        setNextButton(false);

        questionEl.textContent = currentQuestion.text;
        optionsEl.innerHTML = "";

        feedbackEl.textContent = "请选择一个答案。";
        feedbackEl.style.color = "#555";
        feedbackEl.style.background = "#fafafa";

        currentQuestion.options.forEach(function (option, index) {
          const button = document.createElement("button");

          button.type = "button";
          button.textContent = optionLetter(index) + ". " + option;
          button.dataset.index = String(index);

          button.style.cssText = [
            "padding:11px 12px",
            "border:1px solid #ddd",
            "border-radius:6px",
            "background:#fff",
            "text-align:left",
            "cursor:pointer",
            "font-size:14px",
            "color:#333"
          ].join(";");

          button.addEventListener("click", function () {
            submitAnswer(index, false);
          });

          optionsEl.appendChild(button);
        });

        updateScoreAndProgress();
        startTimer();
      }

      function submitAnswer(selectedIndex, isTimeout) {
        if (answered) {
          return;
        }

        answered = true;
        clearTimer();

        const currentQuestion = questions[currentIndex];
        const isCorrect = selectedIndex === currentQuestion.answerIndex;

        disableAllOptions();
        markAnswers(selectedIndex);

        records[currentIndex] = {
          correct: isCorrect,
          timeout: isTimeout,
          selectedIndex: selectedIndex,
          knowledgePoint: currentQuestion.knowledgePoint
        };

        if (isCorrect) {
          score++;

          feedbackEl.style.color = "#1f7a3c";
          feedbackEl.style.background = "#f0fff4";
          feedbackEl.textContent =
            "回答正确。解析：" + currentQuestion.explanation;
        } else if (isTimeout) {
          feedbackEl.style.color = "#b52f2f";
          feedbackEl.style.background = "#fff5f5";
          feedbackEl.textContent =
            "时间到，正确答案是 " +
            optionLetter(currentQuestion.answerIndex) +
            "。解析：" +
            currentQuestion.explanation;
        } else {
          feedbackEl.style.color = "#b52f2f";
          feedbackEl.style.background = "#fff5f5";
          feedbackEl.textContent =
            "回答错误，正确答案是 " +
            optionLetter(currentQuestion.answerIndex) +
            "。解析：" +
            currentQuestion.explanation;
        }

        updateScoreAndProgress();
        setNextButton(true);
      }

      function retryCurrentQuestion() {
        /*
         * 如果上一轮本题答对并已加分，重试前先扣除。
         * 避免反复点击“重试”后造成重复计分。
         */
        const oldRecord = records[currentIndex];

        if (oldRecord && oldRecord.correct) {
          score--;
        }

        records[currentIndex] = null;
        renderQuestion();
      }

      function createList(items, color) {
        const list = document.createElement("ul");
        list.style.cssText =
          "margin:6px 0 10px 20px; padding:0; color:" + color + ";";

        items.forEach(function (item) {
          const li = document.createElement("li");
          li.textContent = item;
          list.appendChild(li);
        });

        return list;
      }

      function renderReport() {
        reviewEl.innerHTML = "";

        const total = questions.length;
        const wrongRecords = records.filter(function (record) {
          return record && !record.correct;
        });

        const timeoutCount = records.filter(function (record) {
          return record && record.timeout;
        }).length;

        const correctRate = Math.round((score / total) * 100);

        const title = document.createElement("div");
        title.textContent = "总体做题情况";
        title.style.cssText =
          "font-size:16px; font-weight:700; color:#245ea8; margin-bottom:5px;";
        reviewEl.appendChild(title);

        const summary = document.createElement("div");
        summary.textContent =
          "本次共完成 " + total + " 题，答对 " + score +
          " 题，答错或超时 " + wrongRecords.length +
          " 题，正确率为 " + correctRate + "%" +
          (timeoutCount > 0 ? "，其中超时 " + timeoutCount + " 题。" : "。");

        reviewEl.appendChild(summary);

        if (score === total) {
          const excellent = document.createElement("div");
          excellent.style.cssText =
            "margin-top:12px; padding:9px 10px; border-radius:6px; background:#e9f8ed; color:#237c3b;";
          excellent.textContent =
            "掌握情况良好：本次全部答对。你已掌握赤道坐标系的基础概念，可以继续学习地平坐标系、黄道坐标系以及坐标转换。";

          reviewEl.appendChild(excellent);
          return;
        }

        const weakTopicMap = {};

        wrongRecords.forEach(function (record) {
          const topic = record.knowledgePoint;

          if (!weakTopicMap[topic]) {
            weakTopicMap[topic] = 0;
          }

          weakTopicMap[topic]++;
        });

        const weakTopics = Object.keys(weakTopicMap)
          .sort(function (a, b) {
            return weakTopicMap[b] - weakTopicMap[a];
          })
          .map(function (topic) {
            return topic + "（" + weakTopicMap[topic] + " 题需要复习）";
          });

        const weakTitle = document.createElement("div");
        weakTitle.textContent = "建议重点复习的知识点";
        weakTitle.style.cssText =
          "font-weight:700; margin-top:12px; color:#9d3333;";

        reviewEl.appendChild(weakTitle);
        reviewEl.appendChild(createList(weakTopics, "#9d3333"));

        const wrongQuestions = [];

        records.forEach(function (record, index) {
          if (record && !record.correct) {
            const status = record.timeout ? "超时" : "答错";

            wrongQuestions.push(
              "第 " + (index + 1) + " 题（" + status + "）：" +
              questions[index].text +
              "【知识点：" + questions[index].knowledgePoint + "】"
            );
          }
        });

        const questionTitle = document.createElement("div");
        questionTitle.textContent = "本次未掌握或未完成的题目";
        questionTitle.style.cssText =
          "font-weight:700; margin-top:10px; color:#555;";

        reviewEl.appendChild(questionTitle);
        reviewEl.appendChild(createList(wrongQuestions, "#555"));

        const advice = document.createElement("div");
        advice.style.cssText =
          "margin-top:10px; padding:9px 10px; border-radius:6px; background:#fff8e7; color:#7b5a15;";

        advice.textContent =
          "复习建议：先复习上方列出的知识点及本题解析，再重新完成练习。若存在超时题，建议优先理解概念，再逐步训练答题速度。";

        reviewEl.appendChild(advice);
      }

      function showResult() {
        clearTimer();

        testEl.style.display = "none";
        resultEl.style.display = "block";

        finalScoreEl.textContent = String(score);
        renderReport();
      }

      function startQuiz() {
        questions = shuffle(questionsBank);
        currentIndex = 0;
        score = 0;
        records = new Array(questions.length).fill(null);

        introEl.style.display = "none";
        resultEl.style.display = "none";
        testEl.style.display = "block";

        renderQuestion();
      }

      startBtn.addEventListener("click", startQuiz);

      retryBtn.addEventListener("click", function () {
        retryCurrentQuestion();
      });

      nextBtn.addEventListener("click", function () {
        if (!answered) {
          return;
        }

        currentIndex++;

        if (currentIndex >= questions.length) {
          showResult();
          return;
        }

        renderQuestion();
      });

      retryAllBtn.addEventListener("click", function () {
        clearTimer();

        resultEl.style.display = "none";
        testEl.style.display = "none";
        introEl.style.display = "block";

        reviewEl.innerHTML = "";
      });
    });
  </script>
</body>
</html>
